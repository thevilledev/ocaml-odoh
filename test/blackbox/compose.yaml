# The containers of test/blackbox/run.sh.
name: odoh-blackbox

services:
  dnsmasq:
    build: dnsmasq
    networks:
      blackbox:
        ipv4_address: 172.30.53.53

  doh-server:
    build: doh-server
    command:
      - --listen-address=0.0.0.0:3000
      - --server-address=172.30.53.53:53
      - --hostname=localhost
    ports:
      - "127.0.0.1:${DOH_PORT:-13000}:3000"
    depends_on: [dnsmasq]
    networks: [blackbox]

  caddy:
    image: caddy:2.10-alpine
    environment:
      PROXY_PORT: ${PROXY_PORT:-18081}
      TARGET_PORT: ${TARGET_PORT:-18080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:8445:8445"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [doh-server]
    networks: [blackbox]

networks:
  blackbox:
    ipam:
      config:
        - subnet: 172.30.0.0/16
